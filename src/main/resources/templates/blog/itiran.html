<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="stylesheet" href="/css/style2.css">
<link rel="stylesheet" href="/css/style1.css">
</head>

<body>
    <div th:replace="~{header :: common-header}"></div>
    <div class="container">
        <h1>ブログ記事一覧</h1>


        <hr>

        <div th:each="blog : ${blogs}" class="blog-card">

            <!-- <h2 class="blog-title" th:text="${blog.title}">タイトル</h2> -->
            <h2 class="blog-title">
                <a th:href="@{/blogs/{id}(id=${blog.id})}" th:text="${blog.title}">ここにタイトルが入ります</a>
            </h2>
            <p class="blog-text" th:text="${blog.text}">本文</p>
        </div>




        <div th:if="${#lists.isEmpty(blogs)}">
            <p>まだ記事がありません。</p>
        </div>
    </div>
</body>
